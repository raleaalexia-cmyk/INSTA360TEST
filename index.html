<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>360° Office</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#000;color:white;font:16px system-ui;text-align:center}#points{position:fixed;inset:0;pointer-events:none}.point{position:absolute;transform:translate(-50%,-50%);pointer-events:none;border:1px solid #fff9;border-radius:22px;background:#111b;color:white;padding:8px 12px;font:13px system-ui;white-space:nowrap}.point i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ff5df;margin-right:7px}.point[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="error"></div><div id="points"><button class="point" id="raoul" hidden><i></i>Raoul</button><button class="point" id="alexia" hidden><i></i>Alexia</button><button class="point" id="patrick" hidden><i></i>Patrick</button><button class="point" id="ionpro" hidden><i></i>ION PRO</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const canvas=document.getElementById('c'),err=document.getElementById('error');
if(!window.THREE){err.style.display='grid';err.textContent='Could not load the 360° viewer. Please refresh when connected to the internet.';return;}
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1100);
const geo=new THREE.SphereGeometry(500,80,60);geo.scale(-1,1,1);
const mat=new THREE.MeshBasicMaterial({color:0xffffff});const sphere=new THREE.Mesh(geo,mat);scene.add(sphere);
let lon=0,lat=0,fov=75,drag=false,x0=0,y0=0,loaded=false;
const tex=new THREE.TextureLoader().load('./Image%20(30).jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;mat.map=t;mat.needsUpdate=true;loaded=true;document.querySelectorAll('.point').forEach(e=>e.hidden=false);},undefined,()=>{err.style.display='grid';err.textContent='The image file could not be loaded. Confirm that Image (30).jpg is in the repository root.';});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
function aim(){lat=Math.max(-80,Math.min(80,lat));camera.fov=fov;camera.updateProjectionMatrix();camera.rotation.order='YXZ';camera.rotation.y=THREE.MathUtils.degToRad(lon);camera.rotation.x=THREE.MathUtils.degToRad(lat);}
// Scene-anchored spherical coordinates (longitude, latitude). Adjust these to the exact subjects in the panorama.\nconst points=[['alexia',-65,-4],['patrick',65,-4],['raoul',0,-2],['ionpro',0,-30]];
function place(){
 if(!loaded)return;
 const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),aspect=camera.aspect;
 for(const [id,longitude,latitude] of points){
  const el=document.getElementById(id);
  const lonRad=THREE.MathUtils.degToRad(longitude),latRad=THREE.MathUtils.degToRad(latitude);
  const v=new THREE.Vector3(-Math.sin(lonRad)*Math.cos(latRad),Math.sin(latRad),-Math.cos(lonRad)*Math.cos(latRad));
  camera.updateMatrixWorld();v.applyQuaternion(camera.quaternion.clone().invert());
  if(v.z>=-0.001){el.hidden=true;continue;}
  const nx=(v.x/-v.z)/(tan*aspect),ny=(v.y/-v.z)/tan;
  el.hidden=Math.abs(nx)>1||Math.abs(ny)>1;
  if(!el.hidden){el.style.left=((nx*.5+.5)*innerWidth)+'px';el.style.top=((.5-ny*.5)*innerHeight)+'px';}
 }
}
function frame(){requestAnimationFrame(frame);aim();renderer.render(scene,camera);place();}
canvas.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;y0=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;lon+=(e.clientX-x0)*.12;lat+=(e.clientY-y0)*.12;x0=e.clientX;y0=e.clientY;});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(35,Math.min(95,fov+e.deltaY*.04));},{passive:false});

addEventListener('resize',resize);resize();frame();
})();
</script>
</body></html>
