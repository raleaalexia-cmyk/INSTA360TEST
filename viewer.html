<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>360 Photo — Pannellum Pins</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<style>
*{box-sizing:border-box}html,body,#panorama{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#panorama{position:fixed;inset:0}



#hint{position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);background:#101010c9;color:#fff;padding:8px 12px;border-radius:10px;font:12px system-ui;white-space:nowrap;max-width:96vw}
.pin-dot{width:14px;height:14px;border-radius:50%;border:3px solid white;background:#25d9bd;box-shadow:0 0 0 3px #0008;display:inline-block;vertical-align:middle;margin-right:6px}
.pannellum-hotspot{background:#111c!important;border:1px solid #ffffff99!important;border-radius:20px!important;padding:6px 10px!important;color:white!important;font:600 14px system-ui!important;white-space:nowrap!important}
.pannellum-hotspot .pin-dot{width:11px;height:11px}

</style>
</head>
<body>
<div id="panorama"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<script>
(()=>{
const names=['Patrick','ION PRO','Raoul','Alexia'];
const ids=['alexia','raoul','patrick','ionpro'];
const key='pannellum-pins-v1';
let viewer=null;
let spots=[
 {pitch:-4,yaw:-65},{pitch:-2,yaw:0},{pitch:-4,yaw:65},{pitch:-30,yaw:0}
];
try{
 const old=JSON.parse(localStorage.getItem('insta360-pin-locations')||'null');
 if(Array.isArray(old)){old.forEach(o=>{const i=ids.indexOf(o.id);if(i>=0&&Number.isFinite(o.lon)&&Number.isFinite(o.lat))spots[i]={pitch:o.lat,yaw:o.lon};});}
 const saved=JSON.parse(localStorage.getItem(key)||'null');
 if(Array.isArray(saved)&&saved.length===4)spots=saved;
}catch(e){}
function htmlFor(name){return '<span class="pin-dot"></span>'+name;}
function drawSpots(){
 const config=viewer.getConfig();
 (config.hotSpots||[]).forEach(h=>viewer.removeHotSpot(h.id));
 spots.forEach((s,i)=>viewer.addHotSpot({id:ids[i],pitch:s.pitch,yaw:s.yaw,type:'info',text:names[i],cssClass:'pannellum-hotspot',createTooltipFunc:(el)=>{el.innerHTML=htmlFor(names[i]);}}));
}
viewer=pannellum.viewer('panorama',{
 type:'equirectangular',panorama:'./Image%20(30).jpg',autoLoad:true,
 showControls:false,showFullscreenCtrl:false,keyboardZoom:true,mouseZoom:true,
 pitch:0,yaw:0,hfov:100,hotSpotDebug:false,escapeHTML:true,hotSpots:[]
});
viewer.on('load',drawSpots);
function save(){try{localStorage.setItem(key,JSON.stringify(spots));localStorage.setItem('insta360-pin-locations',JSON.stringify(spots.map((s,i)=>({id:ids[i],lon:s.yaw,lat:s.pitch}))));}catch(e){}}

})();
</script>
</body>
</html>
