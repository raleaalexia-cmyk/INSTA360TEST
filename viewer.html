<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>360 Photo — Pannellum Pins</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<style>
*{box-sizing:border-box}html,body,#panorama{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#panorama{position:fixed;inset:0}
#tools{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;max-width:96vw;flex-wrap:wrap;justify-content:center;background:#101010c9;padding:8px;border-radius:12px;color:white;font:13px system-ui}
#tools button{border:1px solid #ffffff55;border-radius:8px;background:#282828;color:white;padding:7px 10px;font:inherit}
#tools button.active{background:#087f73;border-color:#72f2dd}
#hint{position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);background:#101010c9;color:#fff;padding:8px 12px;border-radius:10px;font:12px system-ui;white-space:nowrap;max-width:96vw}
.pin-dot{width:14px;height:14px;border-radius:50%;border:3px solid white;background:#25d9bd;box-shadow:0 0 0 3px #0008;display:inline-block;vertical-align:middle;margin-right:6px}
.pannellum-hotspot{background:#111c!important;border:1px solid #ffffff99!important;border-radius:20px!important;padding:6px 10px!important;color:white!important;font:600 14px system-ui!important;white-space:nowrap!important}
.pannellum-hotspot .pin-dot{width:11px;height:11px}
@media(max-width:480px){#tools{top:6px;gap:4px;padding:6px}#tools button{padding:6px 8px;font-size:12px}#hint{font-size:11px;white-space:normal;text-align:center}}
</style>
</head>
<body>
<div id="panorama"></div>
<div id="tools">
<span>Place:</span>
<button data-pin="Alexia" class="active">Alexia</button>
<button data-pin="Raoul">Raoul</button>
<button data-pin="Patrick">Patrick</button>
<button data-pin="ION PRO">ION PRO</button>
<button id="placeMode">Place pin</button>
<button id="lock">Finish / lock</button>
</div>
<div id="hint">Choose a name, tap “Place pin”, then tap its exact spot in the photo. Rotate normally when placement is off.</div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<script>
(()=>{
const names=['Alexia','Raoul','Patrick','ION PRO'];
const ids=['alexia','raoul','patrick','ionpro'];
const key='pannellum-pins-v1';
let selected='Alexia',placing=false,viewer=null;
let spots=[
 {pitch:-4,yaw:-65},{pitch:-2,yaw:0},{pitch:-4,yaw:65},{pitch:-30,yaw:0}
];
try{
 const old=JSON.parse(localStorage.getItem('insta360-pin-locations')||'null');
 if(Array.isArray(old)){old.forEach(o=>{const i=ids.indexOf(o.id);if(i>=0&&Number.isFinite(o.lon)&&Number.isFinite(o.lat))spots[i]={pitch:o.lat,yaw:o.lon};});}
 const saved=JSON.parse(localStorage.getItem(key)||'null');
 if(Array.isArray(saved)&&saved.length===4)spots=saved;
}catch(e){}
function htmlFor(name){return '<span class="pin-dot"></span>'+name;}
function drawSpots(){
 const config=viewer.getConfig();
 (config.hotSpots||[]).forEach(h=>viewer.removeHotSpot(h.id));
 spots.forEach((s,i)=>viewer.addHotSpot({id:ids[i],pitch:s.pitch,yaw:s.yaw,type:'info',text:names[i],cssClass:'pannellum-hotspot',createTooltipFunc:(el)=>{el.innerHTML=htmlFor(names[i]);}}));
}
viewer=pannellum.viewer('panorama',{
 type:'equirectangular',panorama:'./Image%20(30).jpg',autoLoad:true,
 showControls:false,showFullscreenCtrl:false,keyboardZoom:true,mouseZoom:true,
 pitch:0,yaw:0,hfov:100,hotSpotDebug:false,escapeHTML:true,hotSpots:[]
});
viewer.on('load',drawSpots);
function save(){try{localStorage.setItem(key,JSON.stringify(spots));localStorage.setItem('insta360-pin-locations',JSON.stringify(spots.map((s,i)=>({id:ids[i],lon:s.yaw,lat:s.pitch}))));}catch(e){}}
document.querySelectorAll('[data-pin]').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.pin;placing=true;document.querySelectorAll('[data-pin]').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('placeMode').classList.add('active');document.getElementById('placeMode').textContent='Tap photo…';document.getElementById('hint').textContent='Now tap the exact spot in the panorama to move '+selected+'.';}));
document.getElementById('placeMode').addEventListener('click',()=>{
 placing=!placing;document.getElementById('placeMode').classList.toggle('active',placing);
 document.getElementById('placeMode').textContent=placing?'Tap photo…':'Place pin';
 document.getElementById('hint').textContent=placing?'Tap the exact location for '+selected+'.':'Placement off. Drag to look around.';
});
document.getElementById('panorama').addEventListener('click',e=>{
 if(!placing||!viewer)return;
 const coords=viewer.mouseEventToCoords(e);
 const i=names.indexOf(selected);if(i<0||!coords)return;
 spots[i]={pitch:coords[0],yaw:coords[1]};save();drawSpots();placing=false;
 document.getElementById('placeMode').classList.remove('active');document.getElementById('placeMode').textContent='Place pin';
 document.getElementById('hint').textContent=selected+' saved to this location. Choose another name to place its pin.';
});
document.getElementById('lock').addEventListener('click',()=>{placing=false;save();document.getElementById('placeMode').classList.remove('active');document.getElementById('placeMode').textContent='Place pin';document.getElementById('hint').textContent='Pins saved and locked to the panorama. To adjust one, select its name and place it again.';});
})();
</script>
</body>
</html>
